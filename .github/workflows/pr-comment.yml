name: PR Summary Comment

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Post PR Summary
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    
    steps:
    - name: Download artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: ${{ github.event.workflow_run.id }},
          });
          
          console.log('Available artifacts:', artifacts.data.artifacts.map(a => a.name));
    
    - name: Create PR comment
      uses: actions/github-script@v7
      with:
        script: |
          const runId = ${{ github.event.workflow_run.id }};
          const conclusion = '${{ github.event.workflow_run.conclusion }}';
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
          
          // Get PR number from workflow run
          const workflowRun = await github.rest.actions.getWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: runId,
          });
          
          const prNumber = workflowRun.data.pull_requests[0]?.number;
          
          if (!prNumber) {
            console.log('No PR number found, skipping comment');
            return;
          }
          
          const statusEmoji = conclusion === 'success' ? '✅' : '❌';
          const statusText = conclusion === 'success' ? 'passed' : 'failed';
          
          const comment = `## ${statusEmoji} CI Results
          
          The CI workflow has **${statusText}**.
          
          **Workflow Run:** [View Details](${runUrl})
          **Conclusion:** \`${conclusion}\`
          
          ${conclusion === 'success' ? 
            '🎉 All checks passed! Your changes are ready for review.' : 
            '⚠️ Some checks failed. Please review the errors and make necessary fixes.'}
          
          ---
          *This comment is automatically generated by the CI system.*
          `;
          
          // Find existing comment
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });
          
          const botComment = comments.data.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('CI Results')
          );
          
          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: comment,
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment,
            });
          }
